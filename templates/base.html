<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reservation System - Parent-Teacher Night</title>
    <style>
        body { font-family:Arial, Helvetica, sans-serif; }
        .btn { display: inline-block; padding: 10px 20px; background; #e7dfc3; color: beige; text-decoration: none; border-radius: 5px;  }
        .card { background: #dacaa4; padding: 15px; margin-top: 20px; border-radius: 5px; border: 1px solid #ddd; }
    </style>
    </head>
    <body>
        <h1>Parent-Teacher Reservation System</h1>
        <p>Check reservation slots or book reservation slots</p>

        <a href="/book" class="btn">Make reservation</a>

        <div class="card">
            <h3>Available slots</h3
                {% if available %}
                <ul>
                    {% for spot in available %}
                        
                </ul>
        </div>
